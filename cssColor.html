<!DOCTYPE html>
<html>
    <style>
        h.one {
            border-style: double;
            border-color: red;
            background-color: aquamarine;
        }
        h.two {
            border: 2px solid red;
            border-radius: 5px;
            background-color: yellow;
        }
        h.third {
            border-style: dotted ;
            border-color: plum;
            background-color: green;
        }
    </style>
    <body>
        <h1 class="one">Hello Word</h1>
        <h1 class="two">Hello Word</h1>
        <h1 class="third">Hello Word</h1>
    </body>
</html>
