<!DOCTYPE html>
<html>
    <style>
        table, td, th{  
            border: 1px solid black;
        }
        table {
            border-collapse: collapse;
        }   
        th{
            background-color: gray;
        }
        tr{
            background-color: yellow;
        }
        div.table {
            width: 500px;
            margin: auto;
            border: 3px solid green;
            margin-right: 20px;
        }

    </style>
    <body>
        <table>
            <tr>
                <th>Firstname</th>
                <th>Lastname</th>
            </tr>
            <tr>
                <td>1</td>
                <td>1</td>
            </tr>
            <tr>
                <td style="background: white">2</td>
                <td style="background: white">2</td>
            </tr>
            <tr>
                <td>3</td>
                <td>3</td>
            </tr>
        </table>
        <div class="table">
            This div </br>element has <br>position: fixed;
        </div>
    </body>
</html>
