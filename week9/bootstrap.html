<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Bootstrap Page</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  
  <style>
    .component-spacing {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="jumbotron">
    <h1>My First Bootstrap Page</h1>
  </div>
  
  <div class="component-spacing">
    <label for="demoInput">Input:</label>
    <input type="text" id="demoInput" class="form-control">
  </div>
  
  <div id="successAlert" class="alert alert-success component-spacing" style="display: none;">
    Successful alert
  </div>
  
  <div>
    <button type="button" class="btn btn-default" onclick="showAlert()">Button</button>
    <span class="badge">badge</span>
  </div>

</div>

<script>
  function showAlert() {
    // 透過 id 找到提示區塊，並將其 display 樣式改為 'block' (顯示)
    document.getElementById("successAlert").style.display = "block";
  }
</script>

</body>
</html>
