<!DOCTYPE html>
<html>
<head>
<style>
/* 1. 外層容器：使用 space-around 讓瀏覽器自動分配間距，避免 33% 塞不下的問題 */
.container {
  display: flex;
  justify-content: space-around; 
  align-items: center;
  width: 100%; /* 確保容器佔滿整個畫面 */
  padding: 10px;
}

/* 3. 定義中間外框 */
.link-center {
  width: 150px;
  height: 150px;
  display: block;
  flex-shrink: 0; /* 絕對不准壓縮中間這張圖 */
}

/* 4. 圖片設定：消除 img 預設的底部空白 (display: block)，並 100% 填滿外框 */
.link-left img {
  width: 33%;
  height: 300px;
  border-radius: 18px;
  object-fit: cover; /* 左邊：不變形，多餘的部分裁切掉 */
  display: block;
}

.link-center img {
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2px solid black; 
  object-fit: cover; 
  display: block;
}

.link-right img {
  width: 33%;
  height: 150px;
  object-fit: fill; /* 右邊：硬塞進外框，產生 distortion (變形) */
  display: block;
}
</style>
</head>
<body>

<div class="container">
  <a target="_blank" href="paris.jpg" class="link-left">
    <img src="./paris.jpg" alt="Paris">
  </a>
  
  <a target="_blank" href="circle.jpg" class="link-center">
    <img src="./circle.jpg" alt="Circle Image">
  </a>
  
  <a target="_blank" href="paris.jpg" class="link-right">
    <img src="./paris.jpg" alt="Paris">
  </a>
</div>

</body>
</html>
