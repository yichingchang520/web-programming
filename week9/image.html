<!DOCTYPE html>
<html lang="zh-TW">
<head>
<style>
/* 重置基本設定，避免預設邊距干擾計算 */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
}

/* 1. 外層排版：置中對齊，設定固定間距 */
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px; /* 圖片之間的距離 */
  width: 100%;
}

/* 2. 嚴格鎖定左右外框：寬度 33%、高度 300px */
.link-left, .link-right {
  /* flex: 0 0 33% 意思是「不准放大、不准縮小，寬度絕對要是 33%」 */
  flex: 0 0 33%; 
  height: 300px;
  display: block;
}

/* 3. 嚴格鎖定中間外框：寬高 150px */
.link-center {
  flex: 0 0 150px; 
  height: 150px;
  display: block;
}

/* 4. 讓所有圖片 100% 填滿它們的 <a> 外框 */
.container img {
  width: 100%;
  height: 100%;
  display: block;
}

/* =========================================
   以下是完全針對你手繪圖要求的特效設定 
   ========================================= */

/* 左圖：圓角 18px、不要變形 (no distortion) */
.link-left img {
  border-radius: 18px;
  object-fit: cover; /* 關鍵：保持原圖比例填滿框框，多出來的部分會被自動裁切掉，保證不變形 */
}

/* 中圖：變成圓形、加上黑框、不要變形 */
.link-center img {
  border-radius: 50%; /* 把 150x150 的正方形變成完美圓形 */
  border: 2px solid black; 
  object-fit: cover; 
}

/* 右圖：要產生變形效果 (distortion) */
.link-right img {
  /* 預設其實就是 fill，或者我們明確寫出來 */
  object-fit: fill; /* 關鍵：無視原圖比例，硬把整張照片拉長或壓扁來塞進 33% x 300px 的框框中，產生變形 */
}
</style>
</head>
<body>

<div class="container">
  <a target="_blank" href="paris.jpg" class="link-left">
    <img src="./paris.jpg" alt="Paris Left">
  </a>
  
  <a target="_blank" href="circle.jpg" class="link-center">
    <img src="./circle.jpg" alt="Circle Image">
  </a>
  
  <a target="_blank" href="paris.jpg" class="link-right">
    <img src="./paris.jpg" alt="Paris Right">
  </a>
</div>

</body>
</html>
