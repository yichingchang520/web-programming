<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer & Designer Cooperation - Scrolling Info</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .preview-container {
            width: 496px; 
            background: #ffffff;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            /* 讓整個卡片外觀有圓角，稍微現代一點 (選用) */
            border-radius: 4px;
            overflow: hidden; 
        }

        .header {
            height: 35px;
            background-color: #f6f6f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px; 
            border-bottom: 1px solid #eaeaea;
            flex-shrink: 0; /* 確保標題列不會因為內容過多而被壓縮 */
        }

        .header-title {
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            color: #707070;
        }

        .spec-btn {
            height: 22px;
            border-radius: 8px;
            background-color: #ffffff;
            border: 1px solid #2f2f2f;
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            color: #2f2f2f;
            padding: 0 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: background-color 0.2s ease;
        }

        .spec-btn:hover {
            background-color: #f0f0f0;
        }

        /* --- 捲軸功能設定區 --- */
        .content-area {
            /* 設定一個固定高度。240(圖片) + 20(上距) + 20(下距保留) = 280px */
            height: 280px; 
            overflow-y: auto; /* 內容超過高度時，自動顯示垂直捲軸 */
            padding-top: 20px;
            padding-left: 20px;
            padding-bottom: 20px;
            /* 右側不特別寫死 26px，讓捲軸自然佔用空間 */
            padding-right: 10px; 
        }

        /* 自訂捲軸樣式，讓它更美觀 (Webkit 瀏覽器適用) */
        .content-area::-webkit-scrollbar {
            width: 8px;
        }
        .content-area::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        .content-area::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        .content-area::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }

        .image-box {
            width: 450px;
            height: 240px;
            flex-shrink: 0; /* 【關鍵】防止圖片區塊在出現捲軸時被壓縮變形 */
            background-image: url('https://images.unsplash.com/photo-1506744626753-1fa44df14dd4?w=450&h=240&fit=crop');
            background-size: cover;
            background-position: center;
        }

        .info-panel {
            margin-top: 10px; 
            display: none;    
            flex-direction: column;
            padding-bottom: 10px; /* 確保滑到底部時，文字不會貼齊邊緣 */
        }

        .info-panel.visible {
            display: flex;
        }

        .info-row {
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            color: #707070;
            margin-bottom: 6px; 
            word-break: break-all;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="preview-container">
        <div class="header">
            <span class="header-title">預覽</span>
            <button class="spec-btn" id="toggleBtn">查看資訊</button>
        </div>
        
        <div class="content-area">
            <div class="image-box"></div>
            
            <div class="info-panel" id="infoPanel">
                <div class="info-row">修改日期 : 2017/10/12</div>
                <div class="info-row">類別 : JPG</div>
                <div class="info-row">大小 : 466.97KB</div>
                <div class="info-row">路徑 : \\designcenter.qnap.com.tw\DesignCenter\PM、RD 請進入\WEB\Stations\A_Image2PDF\v2\sample</div>
            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const infoPanel = document.getElementById('infoPanel');

        toggleBtn.addEventListener('click', () => {
            const isVisible = infoPanel.classList.toggle('visible');
            
            if (isVisible) {
                toggleBtn.textContent = '收起資訊';
            } else {
                toggleBtn.textContent = '查看資訊';
            }
        });
    </script>

</body>
</html>
