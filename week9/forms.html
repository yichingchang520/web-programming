<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineer & Designer Cooperation - Button Spec</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* 根據設計圖，右側面板總寬度為 496px */
        .preview-container {
            width: 496px; 
            background: #ffffff;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        /* 標題列：高度 35px, 背景 #f6f6f6 */
        .header {
            height: 35px;
            background-color: #f6f6f6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px; 
            border-bottom: 1px solid #eaeaea;
        }

        .header-title {
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            color: #707070;
        }

        /* --- 精確還原設計師標定的按鈕 (Try this) --- */
        .spec-btn {
            height: 22px;              /* size: h22 */
            border-radius: 8px;        /* size: R8 */
            background-color: #ffffff; /* background: #ffffff */
            border: 1px solid #2f2f2f; /* outline: 1px #2f2f2f */
            font-family: 'Roboto', sans-serif; /* Font style: Roboto Regular */
            font-size: 13px;           /* Font size: 13px */
            color: #2f2f2f;            /* Color: #2f2f2f */
            padding: 0 18px;           /* 依據按鈕內的 '18' 標示推測的左右內距 */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: background-color 0.2s ease;
        }

        .spec-btn:hover {
            background-color: #f0f0f0;
        }

        /* 內容區塊與圖片間距：左 20px、右 26px */
        .content-area {
            padding-top: 20px;
            padding-left: 20px;
            padding-right: 26px;
            padding-bottom: 20px;
        }

        /* 圖片範圍：450x240 */
        .image-box {
            width: 450px;
            height: 240px;
            background-image: url('https://images.unsplash.com/photo-1506744626753-1fa44df14dd4?w=450&h=240&fit=crop');
            background-size: cover;
            background-position: center;
        }

        /* 展開資訊面板 */
        .info-panel {
            margin-top: 10px; /* 圖片與文字的間距標示為 10 */
            display: none;    /* 預設隱藏 */
            flex-direction: column;
            margin-bottom: 10px; /* 底部 Min 10 標示 */
        }

        /* 當加入 .visible 類別時顯示面板 */
        .info-panel.visible {
            display: flex;
        }

        .info-row {
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            color: #707070;
            margin-bottom: 6px; /* 每行之間的間距標示為 6 */
            word-break: break-all;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="preview-container">
        <div class="header">
            <span class="header-title">預覽</span>
            <button class="spec-btn" id="toggleBtn">查看資訊</button>
        </div>
        
        <div class="content-area">
            <div class="image-box"></div>
            
            <div class="info-panel" id="infoPanel">
                <div class="info-row">修改日期 : </div>
                <div class="info-row">類別 : </div>
                <div class="info-row">大小 : </div>
                <div class="info-row">路徑 : </div>
            </div>
        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('toggleBtn');
        const infoPanel = document.getElementById('infoPanel');

        // 監聽按鈕點擊事件
        toggleBtn.addEventListener('click', () => {
            // 切換面板的顯示與隱藏
            const isVisible = infoPanel.classList.toggle('visible');
            
            // 根據面板狀態更改按鈕文字 (還原設計圖右下角的收起狀態)
            if (isVisible) {
                toggleBtn.textContent = '收起資訊';
            } else {
                toggleBtn.textContent = '查看資訊';
            }
        });
    </script>

</body>
</html>
