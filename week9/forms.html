<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Preview System - Dynamic Count</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --header-bg: #f6f6f6;
            --list-color: #ffffff;
            --list-border: #eaeaea;
            --list-select-bg: #e8f3ff;
            --list-select-border: #cfddff;
            --bottom-bg: #f3f3f3;
            --text-main: #2f2f2f;
            --text-secondary: #707070;
            --text-highlight: #0084ff;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .app-container {
            display: flex;
            width: 800px;
            height: 450px;
            background: #fff;
            border: 1px solid #ccc;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* --- 左側列表 --- */
        .left-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--list-border);
        }

        .left-header {
            height: 35px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--list-border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            color: var(--text-main);
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
        }

        .list-item {
            height: 28px;
            display: flex;
            align-items: center;
            padding: 0 12px;
            border-bottom: 1px solid var(--list-border);
            font-size: 13px;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
        }

        .list-item:has(input:checked) {
            background-color: var(--list-select-bg);
            border-bottom: 1px solid var(--list-select-border);
        }

        .list-item input[type="checkbox"] {
            margin-right: 12px;
        }

        .left-footer {
            height: 30px;
            background-color: var(--bottom-bg);
            border-top: 1px solid var(--list-border);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 13px;
            color: var(--text-main);
        }

        #selectedCount {
            color: var(--text-highlight);
            font-weight: bold;
            margin-left: 5px;
        }

        /* --- 右側預覽 --- */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .right-header {
            height: 35px;
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--list-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
        }

        /* 根據圖片標註 "Try this" 的精確按鈕樣式 */
        .special-btn {
            /* size: h22 / R8 */
            height: 22px;
            border-radius: 8px;
            
            /* background & outline */
            background-color: #ffffff;
            border: 1px solid #2f2f2f;
            
            /* font style */
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            color: #2f2f2f;
            
            /* alignment & spacing */
            padding: 0 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: all 0.2s;
        }

        .special-btn:hover {
            background-color: #f0f0f0;
        }

        .preview-content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fff;
            overflow-y: auto;
        }

        .image-box {
            width: 450px;
            height: 240px;
            background-color: #fce4cc;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #ccc;
        }

        .info-panel {
            width: 450px;
            margin-top: 15px;
            display: none;
            background-color: #e6ffe6; /* 仿圖中綠色標註區 */
            padding: 10px;
            font-size: 13px;
            line-height: 1.6;
        }

        .info-panel.visible {
            display: block;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="left-panel">
        <div class="left-header">名稱</div>
        <div class="list-container" id="fileList">
            <label class="list-item"><input type="checkbox" checked> 20171012_1.jpg</label>
            <label class="list-item"><input type="checkbox"> 20171012_2.jpg</label>
            <label class="list-item"><input type="checkbox"> 20171012_3.png</label>
            <label class="list-item"><input type="checkbox"> 20171012_4.jpg</label>
            <label class="list-item"><input type="checkbox"> 20171012_5.jpg</label>
            <label class="list-item"><input type="checkbox"> 20171012_6.png</label>
            <label class="list-item"><input type="checkbox"> 20171012_7.jpg</label>
            <label class="list-item"><input type="checkbox"> 20171012_8.jpg</label>
        </div>
        <div class="left-footer">
            數量 : <span id="selectedCount">0</span> / 100
        </div>
    </div>

    <div class="right-panel">
        <div class="right-header">
            <span style="font-size: 13px;">預覽</span>
            <button class="special-btn" id="infoBtn">查看資訊</button>
        </div>
        <div class="preview-content">
            <div class="image-box">
                <span style="color:#707070">預覽圖片區域 (450x240)</span>
            </div>
            <div class="info-panel" id="infoPanel">
                <div>修改日期 : 2017/10/12</div>
                <div>類別 : JPG</div>
                <div>大小 : 466.97KB</div>
                <div style="word-break: break-all;">路徑 : C:\DesignCenter\Sample\Image.jpg</div>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. 動態計數功能
    const checkboxes = document.querySelectorAll('#fileList input[type="checkbox"]');
    const countDisplay = document.getElementById('selectedCount');

    function updateCount() {
        const checkedCount = document.querySelectorAll('#fileList input[type="checkbox"]:checked').length;
        countDisplay.textContent = checkedCount;
    }

    // 監聽每一個 checkbox 的變化
    checkboxes.forEach(box => {
        box.addEventListener('change', updateCount);
    });

    // 初始化計數
    updateCount();

    // 2. 按鈕切換資訊功能
    const infoBtn = document.getElementById('infoBtn');
    const infoPanel = document.getElementById('infoPanel');

    infoBtn.addEventListener('click', () => {
        const isVisible = infoPanel.classList.toggle('visible');
        infoBtn.textContent = isVisible ? '收起資訊' : '查看資訊';
    });
</script>

</body>
</html>
