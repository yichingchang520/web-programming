<!DOCTYPE html>
<html>
<head>
<style>
/* 1. 外層容器：負責把裡面的項目並排置中 */
.container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
}

/* 2. 控制外圍的 <a> 標籤寬度 (Flexbox 的真正對象) */
.link-left, .link-right {
  width: 33%;
  display: block; /* <a> 預設是行內元素，改成 block 才能正常設定寬高 */
}

.link-center {
  width: 150px;
  display: block;
}

/* 3. 讓裡面的圖片統一填滿 <a> 標籤的寬度 (100%) */
.img-left {
  width: 100%; /* 填滿 link-left 的 33% 空間 */
  height: 300px;
  border-radius: 18px;
  object-fit: cover; 
}

.img-center {
  width: 100%; /* 填滿 link-center 的 150px 空間 */
  height: 150px;
  border-radius: 50%; 
  object-fit: cover; 
  border: 3px solid black; 
}

.img-right {
  width: 100%; /* 填滿 link-right 的 33% 空間 */
  height: 300px;
  object-fit: fill; 
}
</style>
</head>
<body>

<div class="container">
  <a target="_blank" href="https://picsum.photos/id/1018/800/1000" class="link-left">
    <img src="https://picsum.photos/id/1018/800/1000" alt="Landscape" class="img-left">
  </a>
  
  <a target="_blank" href="https://picsum.photos/id/1015/800/800" class="link-center">
    <img src="https://picsum.photos/id/1015/800/800" alt="Landscape" class="img-center">
  </a>
  
  <a target="_blank" href="https://picsum.photos/id/1018/800/1000" class="link-right">
    <img src="https://picsum.photos/id/1018/800/1000" alt="Landscape" class="img-right">
  </a>
</div>

</body>
</html>
