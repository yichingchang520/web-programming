<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.img-left {
  width: 33%;
  height: 300px;
  border-radius: 18px;
  object-fit: cover; /* 不變形 */
}

.img-center {
  width: 150px;
  height: 150px;
  border-radius: 50%; /* 完美圓形 */
  object-fit: cover; /* 不變形 */
}

.img-right {
  width: 33%;
  height: 300px;
  object-fit: fill; /* 變形 */
}
</style>
</head>
<body>

<div class="container">
  <a target="_blank" href="https://picsum.photos/id/1018/800/1000">
    <img src="https://picsum.photos/id/1018/800/1000" alt="Landscape" class="img-left">
  </a>
  
  <a target="_blank" href="https://picsum.photos/id/1015/800/800">
    <img src="https://picsum.photos/id/1015/800/800" alt="Landscape" class="img-center">
  </a>
  
  <a target="_blank" href="https://picsum.photos/id/1018/800/1000">
    <img src="https://picsum.photos/id/1018/800/1000" alt="Landscape" class="img-right">
  </a>
</div>

</body>
</html>
