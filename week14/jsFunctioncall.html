<!DOCTYPE html>
<html>
<body>

<p id="demo"></p>

<script>
let radius = 4;
document.getElementById("demo").innerHTML = "The radius is: " + radius;

function calcCircumfrence(){
   return radius * 2 * Math.PI;
}
let circum = calcCircumfrence();

document.getElementById("demo").innerHTML += "<br>The circumfrence is: " + circum;

function calcArea(){
   return radius * radius * Math.PI
}
let area = calcArea();

document.getElementById("demo").innerHTML += "<br>The area is: " + area;

</script>

</body>
</html>
